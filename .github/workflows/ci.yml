name: ci

on:
  pull_request:
  # The merge queue tests the queued result here; without it a queued PR never merges.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # This job name is the required check context in repository-settings.json.
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --include=dev --audit-level=moderate
      - name: check
        run: npm run check
      # test: N/A in AGENTS.md (no logic to test yet)
      - name: build
        run: npm run build && npx wrangler deploy --dry-run
